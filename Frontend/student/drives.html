<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Participating Companies – Student</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon"><i class="fas fa-graduation-cap"></i></div><div class="sidebar-brand-text"><h2>Vidya Sethu</h2><p>Student Portal</p></div></div>
    <nav class="sidebar-nav"><div class="nav-section-label">Menu</div><ul>
      <li class="nav-item"><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
      <li class="nav-item"><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
      <li class="nav-item active"><a href="drives.html"><i class="fas fa-building"></i> Companies</a></li>
      <li class="nav-item"><a href="journey.html"><i class="fas fa-road"></i> My Journey</a></li>
    </ul></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="user-avatar" id="sidebarAvatar">S</div><div class="user-info"><div class="user-name" id="sidebarUserName">Student</div><div class="user-role" id="sidebarUserRole">Roll No</div></div></div>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1>Participating Companies</h1>
        <p>Companies present at the current placement drive — show your <strong>4-digit code</strong> at each desk to check in</p>
      </div>
    </div>
    <div class="page-body">
      <div id="companiesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">
        <div style="grid-column:1/-1" class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading companies...</p></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
  requireAuth('student'); initSidebar('student');
  loadCompanies();

  async function loadCompanies() {
    const data = await api.get('/student/companies');
    const companies = data.companies || [];
    const grid = document.getElementById('companiesGrid');

    if (!companies.length) {
      grid.innerHTML = '<div style="grid-column:1/-1" class="empty-state"><i class="fas fa-building"></i><p>No companies participating in a current drive. Check back soon!</p></div>';
      return;
    }

    grid.innerHTML = companies.map(d => `
      <div class="card" style="position:relative;overflow:hidden">
        <div style="position:absolute;top:0;right:0;width:80px;height:80px;background:linear-gradient(135deg,var(--primary),var(--secondary));opacity:0.08;border-radius:0 14px 0 80px"></div>

        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <h3 style="font-size:16px;font-weight:700">${d.company_name}</h3>
            <p style="color:var(--text-secondary);font-size:13px;margin-top:2px">${d.job_role || 'Role to be announced'}</p>
          </div>
          ${d.ctc ? `<span class="badge badge-shortlisted" style="white-space:nowrap">₹${d.ctc} LPA</span>` : ''}
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
          <div class="flex gap-8 text-sm">
            <i class="fas fa-calendar" style="color:var(--primary);width:16px"></i>
            <span>${d.event_name || 'Mega Drive'} &nbsp;·&nbsp; ${formatDate(d.event_date)}</span>
          </div>
          ${d.description ? `
          <div class="flex gap-8 text-sm">
            <i class="fas fa-info-circle" style="color:var(--text-muted);width:16px"></i>
            <span>${d.description}</span>
          </div>` : ''}
          <div class="flex gap-8 text-sm">
            <i class="fas fa-code-branch" style="color:var(--secondary);width:16px"></i>
            <span>${d.eligibility_branches || 'All Branches'}</span>
          </div>
        </div>

        <div style="padding:10px 14px;background:rgba(37,99,235,0.05);border-radius:8px;border:1px solid rgba(37,99,235,0.15);font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:8px">
          <i class="fas fa-info-circle" style="color:var(--primary)"></i>
          Visit this company's desk and give your 4-digit code to the Student Coordinator
        </div>
      </div>`).join('');
  }
</script>
</body></html>
