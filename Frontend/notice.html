<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sandip University - Live Drive</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #2563EB;
      --bg-white: #FFFFFF;
      --bg-body: #F3F4F6;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --border-color: #D1D5DB;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40vh;
      background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
      z-index: 0;
    }

    .notice-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
      text-align: center;
      background: var(--bg-white);
      border-radius: 12px;
      padding: 60px 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid #E5E7EB;
    }

    .uni-logo {
      height: 90px;
      width: auto;
      margin-bottom: 24px;
    }

    .session-code {
      font-size: 80px;
      font-weight: 700;
      letter-spacing: 12px;
      color: var(--primary);
      background: rgba(37, 99, 235, 0.05);
      padding: 20px 40px;
      border-radius: 12px;
      border: 2px dashed rgba(37, 99, 235, 0.3);
      font-family: monospace;
      display: inline-block;
      margin: 30px 0;
    }

    .qr-wrap {
      background: white;
      padding: 24px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .qr-wrap img {
      width: 220px;
      height: 220px;
      display: block;
    }

    .error-card {
      color: #DC2626;
      font-size: 20px;
      padding: 30px;
      border: 1px solid #FECACA;
      background: #FEF2F2;
      border-radius: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="notice-card" id="content">
    <img src="student/SANDIP_LOGO-removebg-preview (1).png" alt="University Logo" class="uni-logo" />

    <h1 id="companyName" style="font-size:36px; font-weight:700; color:#111827; margin-bottom:8px">Connecting...</h1>
    <p id="jobRole" style="font-size:18px; color:#6B7280; font-weight:500;">Please wait while we load the upcoming drive
    </p>

    <div id="sessionBox" class="hidden">
      <div style="font-size:22px; margin-top:40px; color:#374151; font-weight:600;">Active Attendance Session</div>
      <div class="session-code" id="codeText"></div>
      <p style="font-size:16px; color:#6B7280; margin-bottom:20px;">Students: Please login to your portal and enter this
        code to mark attendance.</p>

      <div class="qr-wrap" id="qrWrap">
        <img id="qrImg" src="" alt="QR Code" />
        <div style="color:#111827; font-weight:600; margin-top:16px; font-size:15px">Scan to open Portal</div>
      </div>
    </div>

    <div id="noSession" class="hidden error-card" style="margin-top:40px;">
      <i class="fas fa-info-circle"></i> No active attendance session at the moment.
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const driveId = urlParams.get('drive');

    if (!driveId) {
      document.getElementById('content').innerHTML = `
      <img src="student/SANDIP_LOGO-removebg-preview (1).png" alt="University Logo" class="uni-logo" />
      <div style="font-size:48px;color:#DC2626;margin-bottom:16px"><i class="fas fa-exclamation-triangle"></i></div>
      <h2 style="font-size:28px; font-weight:700;">Invalid Link</h2>
      <p style="color:#6B7280; margin-top:12px; font-size:16px;">This live session link is missing the drive ID.</p>
    `;
    } else {
      loadNotice();
      setInterval(loadNotice, 10000); // Auto-refresh every 10s
    }

    async function loadNotice() {
      try {
        const res = await fetch(`/api/notice/drive/${driveId}`);
        const data = await res.json();

        if (!data.success) {
          document.getElementById('companyName').textContent = 'Drive Not Found';
          document.getElementById('jobRole').textContent = data.message;
          return;
        }

        document.getElementById('companyName').textContent = data.drive.company_name;
        // BUG FIX: was using data.drive.drive_date which no longer exists — now use event_date from notice route
        // The notice route returns drive fields only; event_date is not joined. Show job_role only.
        document.getElementById('jobRole').textContent = data.drive.job_role || '';

        if (data.session) {
          document.getElementById('noSession').classList.add('hidden');
          document.getElementById('sessionBox').classList.remove('hidden');
          document.getElementById('codeText').textContent = data.session.code;
          if (data.qr_code) {
            document.getElementById('qrImg').src = data.qr_code;
            document.getElementById('qrWrap').style.display = '';
          } else {
            document.getElementById('qrWrap').style.display = 'none';
          }
        } else {
          document.getElementById('sessionBox').classList.add('hidden');
          document.getElementById('noSession').classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>

</html>
